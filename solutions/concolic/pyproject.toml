[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "concolic"
version = "0.1.0"
description = "Group 6's concolic"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "hypothesis>=6.168.2",
  "jpamb",
]


[project.scripts]
concolic-interpreter = "concolic:interpret"
concolic-analysis = "concolic:analyse"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }
